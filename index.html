<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#161040" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f0f0ff" media="(prefers-color-scheme: light)" />
  <title>Reservas - Cooperativa de Enseñanza La Hispanidad</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/theme.css" />
  <!-- Librería de Google para Login -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            display: ['Outfit', 'sans-serif'],
            body: ['Plus Jakarta Sans', 'sans-serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            primary: { 50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 800: '#3730a3', 900: '#312e81', 950: '#1e1b4b' },
            app: 'var(--bg-app)',
            card: 'var(--bg-card)',
            glass: {
              border: 'var(--glass-border)',
              bg: 'var(--glass-bg)',
            },
            muted: 'var(--text-muted)',
            brand: {
              50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 800: '#075985', 900: '#0c4a6e', 950: '#082f49',
            },
            accent: { 50: '#faf5ff', 100: '#f3e8ff', 200: '#e9d5ff', 300: '#d8b4fe', 400: '#c084fc', 500: '#a855f7', 600: '#9333ea', 700: '#7e22ce', 800: '#6b21a8', 900: '#581c87', 950: '#3b0764' },
          },
          animation: {
            'float': 'float 6s ease-in-out infinite',
            'glow-pulse': 'glow-pulse 2s ease-in-out infinite',
            'slide-up': 'slide-up 0.5s cubic-bezier(0.16, 1, 0.3, 1)',
            'slide-down': 'slide-down 0.5s cubic-bezier(0.16, 1, 0.3, 1)',
            'slide-in-right': 'slide-in-right 0.5s cubic-bezier(0.16, 1, 0.3, 1)',
            'scale-in': 'scale-in 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
            'fade-in': 'fade-in 0.5s ease-out',
            'bounce-subtle': 'bounce-subtle 2s ease-in-out infinite',
            'shimmer': 'shimmer 2s linear infinite',
            'gradient-shift': 'gradient-shift 4s ease-in-out infinite',
            'pulse-ring': 'pulse-ring 1.5s ease-out infinite',
            'blob': 'blob 7s infinite',
            'marquee': 'marquee 20s linear infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
              '33%': { transform: 'translateY(-12px) rotate(1deg)' },
              '66%': { transform: 'translateY(6px) rotate(-1deg)' },
            },
            'glow-pulse': {
              '0%, 100%': { opacity: '0.5', filter: 'blur(20px)' },
              '50%': { opacity: '0.8', filter: 'blur(25px)' },
            },
            'slide-up': {
              '0%': { opacity: '0', transform: 'translateY(24px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            'slide-down': {
              '0%': { opacity: '0', transform: 'translateY(-24px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            'slide-in-right': {
              '0%': { opacity: '0', transform: 'translateX(32px)' },
              '100%': { opacity: '1', transform: 'translateX(0)' },
            },
            'scale-in': {
              '0%': { opacity: '0', transform: 'scale(0.92)' },
              '100%': { opacity: '1', transform: 'scale(1)' },
            },
            'fade-in': {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            'bounce-subtle': {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-4px)' },
            },
            'gradient-shift': {
              '0%': { backgroundPosition: '0% 50%' },
              '50%': { backgroundPosition: '100% 50%' },
              '100%': { backgroundPosition: '0% 50%' },
            },
            'pulse-ring': {
              '0%': { transform: 'scale(1)', opacity: '0.6' },
              '100%': { transform: 'scale(1.5)', opacity: '0' },
            },
            shimmer: {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' },
            },
            blob: {
              '0%': { transform: 'translate(0px, 0px) scale(1)' },
              '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
              '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
              '100%': { transform: 'translate(0px, 0px) scale(1)' },
            },
            marquee: {
              '0%': { transform: 'translateX(0%)' },
              '100%': { transform: 'translateX(-33.33%)' },
            }
          }
        },
      },
    }
  </script>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.560.0",
    "date-fns/": "https://esm.sh/date-fns@^4.1.0/",
    "date-fns": "https://esm.sh/date-fns@^4.1.0",
    "react/": "https://esm.sh/react@^19.2.2/",
    "react": "https://esm.sh/react@^19.2.2",
    "react-dom/": "https://esm.sh/react-dom@^19.2.2/",
    "react-dom": "https://esm.sh/react-dom@^19.2.2",
    "socket.io-client": "https://esm.sh/socket.io-client@^4.8.1"
  }
}
</script>
  <style>
    /* Minimal inline — all design system styles live in theme.css */
    body {
      overflow-x: hidden;
    }
  </style>
</head>

<body class="antialiased">
  <div class="bg-mesh"></div>
  <div id="root"></div>
  <script src="/dist/bundle.js"></script>
</body>

</html>
